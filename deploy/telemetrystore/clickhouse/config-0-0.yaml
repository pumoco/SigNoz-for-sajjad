asynchronous_metric_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
dictionaries_config: '*_dictionary.xml'
display_name: cluster
distributed_ddl: {path: /clickhouse/task_queue/ddl}
format_schema_path: /var/lib/clickhouse/format_schemas/
http_port: 8123
interserver_http_port: 9009
listen_host: 0.0.0.0
logger:
  console: 1
  level: information
  size: 1000M
macros: {replica: "00", shard: "00"}
path: /var/lib/clickhouse/
profiles:
  default:
    allow_simdjson: 0
    load_balancing: random
    log_queries: 1
remote_servers:
  cluster:
    shard:
      replica:
        - {host: signoz-telemetrystore-clickhouse-0-0, port: 9000}
tcp_port: 9000
tmp_path: /var/lib/clickhouse/tmp/
user_defined_executable_functions_config: '*functions.yaml'
user_directories:
  users_xml: {path: config-0-0.yaml}
users:
  default:
    access_management: 1
    named_collection_control: 1
    networks: {ip: '::/0'}
    password: ''
    profile: default
    quota: default
    show_named_collection: 1
    show_named_collection_secrets: 1
zookeeper:
  node: [{host: signoz-telemetrykeeper-clickhousekeeper-0, port: 9181}]
