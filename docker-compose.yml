services:
  otel-gateway:
    image: otel/opentelemetry-collector-contrib:0.136.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      SIGNOZ_OTLP_HTTP_ENDPOINT: ${SIGNOZ_OTLP_HTTP_ENDPOINT:-http://signoz:4318}
    volumes:
      - ./otel/collector.config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  # SigNoz's official bundle should be installed/pinned separately according
  # to the release supported by Runflare. Do not substitute an old Compose
  # snapshot here: the bundle includes ClickHouse and internal dependencies.
  observability-contract:
    image: nginx:1.29-alpine
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./runflare/healthz.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      otel-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
